name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libeigen3-dev \
            libserialport-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            scikit-build-core \
            pybind11 \
            cmake \
            ninja \
            pin==4.1.0 \
            cmeel-urdfdom-headers

      - name: Configure Pinocchio environment
        shell: bash
        run: |
          PREFIX=$(python -m cmeel cmake)

          echo "CMEEL_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

          echo "Pinocchio prefix: $PREFIX"
          find "$PREFIX" -iname '*pinocchio*config.cmake' \
            -o -iname 'pinocchio.cps'

      - name: Verify Pinocchio
        run: |
          python -c "import pinocchio; print(pinocchio.__file__)"
          test -n "$CMEEL_PREFIX"
          find "$CMEEL_PREFIX" -iname '*pinocchio*config.cmake'

      - name: Build wheel
        run: |
          python -m pip wheel . \
            --no-build-isolation \
            --no-deps \
            --wheel-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-24.04
          path: wheelhouse/*.whl