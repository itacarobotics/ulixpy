name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libeigen3-dev

      - name: Install libserialport
        run: |
          sudo apt update
          sudo apt install -y libserialport-dev

      - name: Add robotpkg repository
        run: |
          sudo apt install -qqy lsb-release curl
          sudo mkdir -p /etc/apt/keyrings
          curl http://robotpkg.openrobots.org/packages/debian/robotpkg.asc \
            | sudo tee /etc/apt/keyrings/robotpkg.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/robotpkg.asc] http://robotpkg.openrobots.org/packages/debian/pub $(lsb_release -cs) robotpkg" \
            | sudo tee /etc/apt/sources.list.d/robotpkg.list
          sudo apt update
      
      - name: Install Pinocchio
        run: |
          sudo apt-get install -y 'robotpkg-py3*-pinocchio'

      - name: Configure robotpkg environment
        run: |
          export PATH=/opt/openrobots/bin:$PATH
          export PKG_CONFIG_PATH=/opt/openrobots/lib/pkgconfig:$PKG_CONFIG_PATH
          export LD_LIBRARY_PATH=/opt/openrobots/lib:$LD_LIBRARY_PATH
          export PYTHONPATH=/opt/openrobots/lib/python3.10/site-packages:$PYTHONPATH # Adapt your desired python version here
          export CMAKE_PREFIX_PATH=/opt/openrobots:$CMAKE_PREFIX_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 cmake ninja

      - name: Build wheel
        run: |
          python -m pip wheel . \
            --no-build-isolation \
            --no-deps \
            --wheel-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-24.04
          path: wheelhouse/*.whl