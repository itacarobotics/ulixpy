[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.11",
    # on Windows pinocchio comes from conda-forge
    "pin==4.1.0; sys_platform != 'win32'",
    "cmeel-urdfdom-headers; sys_platform != 'win32'",
]
build-backend = "scikit_build_core.build"

[project]
name = "ulixpy"
version = "0.1.4"
requires-python = ">=3.10"
dependencies = ["numpy", "pin==4.1.0; sys_platform != 'win32'"]
